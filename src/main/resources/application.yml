# DATABASE_URL and TEST_MODE are read by config/LibraryEnvironmentPostProcessor.
# LIBRARY_TODAY is read by web/TodayResolver.

server:
  port: ${PORT:8000}
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: library-api
  main:
    banner-mode: off
  jackson:
    property-naming-strategy: SNAKE_CASE
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: false
  web:
    resources:
      # No static files, so an unknown path is a NoHandlerFoundException we can turn into 404 not_found.
      add-mappings: false

logging:
  level:
    org.hibernate.orm.deprecation: error
    # An unknown path is a normal 404 here, not something to warn about.
    org.springframework.web.servlet.PageNotFound: error
